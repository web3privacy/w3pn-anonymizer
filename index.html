<!doctype html>
<html lang="en" data-theme="dark" translate="no">
  <head>
    <script>
      (function () {
        var mobile = window.matchMedia('(max-width: 1024px)').matches
        var stored = localStorage.getItem('anonymizer-theme')
        var theme = mobile ? 'dark' : (stored === 'light' || stored === 'dark' ? stored : 'dark')
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      (function () {
        if (!window.matchMedia('(max-width: 1024px)').matches) return
        var meta = document.querySelector('meta[name="viewport"]')
        if (meta) {
          meta.setAttribute(
            'content',
            'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover',
          )
        }
      })()
    </script>

    <title>W3PN Anonymizer — Privacy-First Photo & Video Anonymization</title>
    <meta name="description" content="Free, open-source tool for anonymizing faces in photos and videos. 100% local processing — no uploads, no servers, no tracking. Blur, pixelate, emoji, and 14+ effects." />
    <meta name="keywords" content="anonymizer, face blur, photo privacy, video anonymization, face detection, image editor, privacy tool, open source, local processing, GDPR" />
    <meta name="author" content="Web3Privacy Now" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://anonymizer.web3privacy.info" />

    <!-- Open Graph / Social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="W3PN Anonymizer — Privacy-First Face Anonymization" />
    <meta property="og:description" content="Anonymize faces in photos and videos directly in your browser. 100% local, no data ever leaves your device." />
    <meta property="og:url" content="https://anonymizer.web3privacy.info" />
    <meta property="og:image" content="https://anonymizer.web3privacy.info/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="W3PN Anonymizer" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="W3PN Anonymizer — Privacy-First Face Anonymization" />
    <meta name="twitter:description" content="Anonymize faces in photos and videos directly in your browser. 100% local, no data ever leaves your device." />
    <meta name="twitter:image" content="https://anonymizer.web3privacy.info/og-image.png" />

    <!-- PWA / App manifest hints -->
    <meta name="application-name" content="W3PN Anonymizer" />
    <meta name="apple-mobile-web-app-title" content="W3PN Anonymizer" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <style>
      html,
      body {
        background: #000;
      }

      #native-boot {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: #000;
        color: #fff;
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      #native-boot .native-boot-mark {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        transform: translateY(-2vh);
      }

      #native-boot .native-boot-pulse {
        width: 24px;
        height: 24px;
        border-radius: 7px;
        background: #00ff78;
        box-shadow: 0 0 28px rgba(0, 255, 120, 0.45);
        animation: nativeBootPulse 1.25s ease-in-out infinite;
      }

      #native-boot .native-boot-word {
        font-size: clamp(18px, 4.4vw, 30px);
        font-weight: 800;
      }

      #native-boot.native-boot--hide {
        opacity: 0;
        pointer-events: none;
        transition: opacity 180ms ease;
      }

      @keyframes nativeBootPulse {
        0%,
        100% {
          transform: rotate(0deg) scale(0.82);
          opacity: 0.68;
        }

        50% {
          transform: rotate(9deg) scale(1);
          opacity: 1;
        }
      }
    </style>
    <!-- Favicons (generated from /brand/favicon-source.png via npm run icons:favicons) -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <!-- Self-hosted Material Symbols — no third-party requests -->
    <link rel="stylesheet" href="/fonts/material-symbols.css" />

    <!-- Structured data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "W3PN Anonymizer",
      "url": "https://anonymizer.web3privacy.info",
      "description": "Privacy-first photo and video anonymization tool. Blur, pixelate, and anonymize faces directly in your browser with zero data collection.",
      "applicationCategory": "MultimediaApplication",
      "operatingSystem": "Web, macOS, Windows, Linux",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "author": {
        "@type": "Organization",
        "name": "Web3Privacy Now",
        "url": "https://www.web3privacy.info"
      },
      "license": "https://opensource.org/licenses/MIT",
      "isAccessibleForFree": true
    }
    </script>
  </head>
  <body>
    <div id="native-boot" aria-hidden="true">
      <div class="native-boot-mark">
        <div class="native-boot-pulse"></div>
        <div class="native-boot-word">Anonymizer</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
